<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cálculo Manga y Resina</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="icon" href="/logo-pepe-nunez.png" type="image/png">

<style>

body{
    background:#f4f6f9;
}

.logo-empresa{
    width: 100%;
    max-width:480px;
    min-width: 180px;
    height:auto;

}

.titulo-app{
    color:#eca539;
    font-weight:700;
}

.btn-danger{
    background:#c91d24;
    border-color:#c91d24;
}

.btn-danger:hover{
    background:#a5161c;
    border-color:#a5161c;
}

.result-card{
    transition:all .3s ease;
}

.result-card:hover{
    transform:translateY(-5px);
}

.result-value{
    font-size:2.3rem;
    font-weight:bold;
    color:#c91d24;
}

.card{
    border-radius:18px;
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#666;
    font-size:.9rem;
}

.footer span{
    color:#c91d24;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="container py-5">

    <!-- CABECERA -->

<div class="card shadow border-0 mb-4">

    <div class="card-body text-center py-4">

        <img
            src="logo-pepe-nunezB.png"
            alt="Pepe Núñez"
            class="logo-empresa mb-3">

        <h1 class="titulo-app">
            Cálculo de Manga y Resina
        </h1>

    </div>

</div>

    <!-- FORMULARIO -->

    <div class="card shadow border-0">

        <div class="card-body p-4">

            <div class="row g-4">

                <div class="col-md-3">
                    <label class="form-label fw-semibold">
                        Tipo Manga
                    </label>

                    <select id="tipoManga" class="form-select">

                        <option value="0">DN 70-100</option>
                        <option value="1">DN 100-150</option>
                        <option value="2">DN 150-225</option>
                        <option value="3">DN 200-300</option>
                        <option value="4">DN 300-450</option>

                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">
                        DN (mm)
                    </label>

                    <input
                        type="number"
                        id="diametro"
                        class="form-control"
                        placeholder="Ej: 150">
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">
                        Tramo (m)
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        id="tramo"
                        class="form-control"
                        placeholder="Ej: 25.50">
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">
                        Cuello (m)
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        id="cuello"
                        class="form-control"
                        placeholder="Ej: 0.50">
                </div>

            </div>

            <div class="d-grid mt-4">

                <button
                    class="btn btn-danger btn-lg"
                    onclick="calcular()">

                    <i class="bi bi-lightning-charge-fill"></i>
                    Calcular

                </button>

            </div>

        </div>

    </div>

    <!-- RESULTADOS -->

    <div class="row mt-4 g-4">

        <div class="col-md-6">

            <div class="card shadow border-0 result-card">

                <div class="card-body text-center">

                    <i class="bi bi-scissors fs-1 text-danger"></i>

                    <h4 class="mt-2">
                        Manga a cortar
                    </h4>

                    <div
                        id="mangaResultado"
                        class="result-value">

                        --
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow border-0 result-card">

                <div class="card-body text-center">

                    <i class="bi bi-droplet-fill fs-1 text-primary"></i>

                    <h4 class="mt-2">
                        Resina total
                    </h4>

                    <div
                        id="resinaResultado"
                        class="result-value">

                        --
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

function round2(v){
    return Math.round(v * 100) / 100;
}

function mangaCorte(tipo, dm, tramo, cuello){

    let retraccion;

    if(tipo===0 && dm>=70 && dm<=100)
        retraccion=0.5333*(dm-70);

    else if(tipo===1 && dm>=100 && dm<=150)
        retraccion=0.32*(dm-100);

    else if(tipo===2 && dm>=150 && dm<=225)
        retraccion=0.2133*(dm-150);

    else if(tipo===3 && dm>=200 && dm<=300)
        retraccion=0.16*(dm-200);

    else if(tipo===4 && dm>=300 && dm<=450)
        retraccion=0.1067*(dm-300);

    else
        return -1;

    return round2(
        ((tramo+cuello)*(1+retraccion/100))+2
    );
}

function resinaTotal(tipo, dm, tramo, cuello){

    let resina;
    let manga=mangaCorte(tipo,dm,tramo,cuello);

    if(manga<0)
        return -1;

    if(tipo===0 && dm>=70 && dm<=100)
        resina=(0.005*(dm-70))+0.55;

    else if(tipo===1 && dm>=100 && dm<=150)
        resina=(0.0042*(dm-100))+0.82;

    else if(tipo===2 && dm>=150 && dm<=225)
        resina=(0.004*(dm-150))+1.24;

    else if(tipo===3 && dm>=200 && dm<=300)
        resina=(0.0044*(dm-200))+1.65;

    else if(tipo===4 && dm>=300 && dm<=450)
        resina=(0.00407*(dm-300))+2.47;

    else
        return -1;

    return round2(
        (manga-cuello)*resina
    );
}

function calcular(){

    const tipo =
        parseInt(
            document.getElementById("tipoManga").value
        );

    const dm =
        parseInt(
            document.getElementById("diametro").value
        );

    const tramo =
        parseFloat(
            document.getElementById("tramo").value
        );

    const cuello =
        parseFloat(
            document.getElementById("cuello").value
        );

    if(
        isNaN(dm) ||
        isNaN(tramo) ||
        isNaN(cuello)
    ){
        mostrarError();
        return;
    }

    const manga =
        mangaCorte(
            tipo,
            dm,
            tramo,
            cuello
        );

    const resina =
        resinaTotal(
            tipo,
            dm,
            tramo,
            cuello
        );

    if(manga<0){
        mostrarError();
        return;
    }

    document.getElementById("mangaResultado")
        .innerHTML =
        manga + " m";

    document.getElementById("resinaResultado")
        .innerHTML =
        resina + " kg";
}

function mostrarError(){

    document.getElementById("mangaResultado")
        .innerHTML="Error";

    document.getElementById("resinaResultado")
        .innerHTML="Error";
}

</script>

<div class="footer">

    <hr>

    <p>
        © 2025 <span>Pepe Núñez</span> · Sistema de cálculo de manga y resina
    </p>

</div>

</body>
</html>
